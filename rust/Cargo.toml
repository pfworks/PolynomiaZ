[package]
name = "pltz"
version = "0.1.0"
edition = "2021"
description = "Polar coordinate compression — models data as mathematical functions on virtual disk platters"

[dependencies]
flate2 = "=1.0.28"
clap = { version = "=4.4.18", features = ["derive"] }
rustfft = "=6.1.0"
rayon = "=1.7.0"
zstd = "=0.12.4"
brotli = "=3.4.0"
lzma-rs = "=0.2.0"
