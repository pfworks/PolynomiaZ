[package]
name = "pltz"
version = "0.1.0"
edition = "2021"
description = "Polar coordinate compression — models data as mathematical functions on virtual disk platters"

[dependencies]
flate2 = "1.0.28"
clap = { version = "4.4", features = ["derive"] }

[[bin]]
name = "pltz"
path = "src/main.rs"

[lib]
name = "pltz"
path = "src/lib.rs"
